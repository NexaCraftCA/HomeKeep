name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Supabase keys
        run: |
          cat >> local.properties <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Decode upload keystore
        if: ${{ secrets.HOMEKEEP_KEYSTORE_BASE64 != '' }}
        env:
          HOMEKEEP_KEYSTORE_BASE64: ${{ secrets.HOMEKEEP_KEYSTORE_BASE64 }}
        run: echo "$HOMEKEEP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homekeep-upload.jks"

      - name: Configure signing
        if: ${{ secrets.HOMEKEEP_KEYSTORE_BASE64 != '' }}
        run: |
          cat >> local.properties <<EOF
          HOMEKEEP_KEYSTORE_PATH=$RUNNER_TEMP/homekeep-upload.jks
          HOMEKEEP_KEYSTORE_PASSWORD=${{ secrets.HOMEKEEP_KEYSTORE_PASSWORD }}
          HOMEKEEP_KEY_ALIAS=${{ secrets.HOMEKEEP_KEY_ALIAS }}
          HOMEKEEP_KEY_PASSWORD=${{ secrets.HOMEKEEP_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK and release bundle
        run: ./gradlew :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: homekeep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: homekeep-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
